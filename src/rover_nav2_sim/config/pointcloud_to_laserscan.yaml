pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_footprint
    transform_tolerance: 0.05

    min_height: 0.05
    max_height: 1.40

    angle_min: -1.05
    angle_max: 1.05
    angle_increment: 0.0087
    scan_time: 0.10

    range_min: 0.35
    range_max: 5.0
    use_inf: true
    inf_epsilon: 1.0

    queue_size: 10
