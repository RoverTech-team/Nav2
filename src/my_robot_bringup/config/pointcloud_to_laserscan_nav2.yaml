pointcloud_to_laserscan:
    ros__parameters:
        target_frame: base_footprint
        transform_tolerance: 0.30
        concurrency_level: 1

        min_height: 0.05
        max_height: 1.40

        # Il count di letture deve far cadere (max-min)/increment con
        # parte frazionaria in (0, 0.5): pointcloud_to_laserscan usa ceil(),
        # slam_toolbox/karto usa round()+1. Con 2.4/0.0085 = 282.353 entrambi
        # arrivano a 283 e karto non scarta gli scan.
        angle_min: -1.20
        angle_max:  1.20
        angle_increment: 0.0085
        scan_time: 0.10

        range_min: 0.35
        range_max: 15.0
        use_inf: true
        inf_epsilon: 1.0

        queue_size: 5
