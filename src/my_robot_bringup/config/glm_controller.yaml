controller_manager:
  ros__parameters:
    update_rate: 50  # Control loop rate in Hz
    
    skid_steer_base_controller:
      type: diff_drive_controller/DiffDriveController
      
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


skid_steer_base_controller:
  ros__parameters:
    # 1. Define all wheels on each side
    left_wheel_names: ["base_front_left_wheel_joint", "base_middle_left_wheel_joint", "base_back_left_wheel_joint"]
    right_wheel_names: ["base_front_right_wheel_joint", "base_middle_right_wheel_joint", "base_back_right_wheel_joint"]
    
    # 2. REMOVED "wheels_per_side" - See explanation below
    
    # 3. Kinematic dimensions (in meters)
    wheel_separation: 0.47
    wheel_radius: 0.1
    
    # 4. Skid-steer specific tuning
    # Skid-steering relies on wheel slip to turn, meaning the "effective" 
    # wheelbase is wider than the physical wheelbase. 
    wheel_separation_multiplier: 1.5 
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # 5. Odometry and TF settings
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    
    open_loop: false
    enable_odom_tf: true
    position_feedback: false
    
    # FIX: Removed duplicate "use_stamped_vel". Kept false (standard cmd_vel is unstamped).
    use_stamped_vel: true
    cmd_vel_timeout: 0.5

    # 6. Velocity and Acceleration Limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: true
        max_acceleration: 0.8
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.5
        has_acceleration_limits: true
        max_acceleration: 1.0