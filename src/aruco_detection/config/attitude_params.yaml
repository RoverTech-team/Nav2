aruco_attitude_node:
  ros__parameters:
    marker_frame: zed_camera_link
    base_frame: base_footprint
    yaw_threshold: 10.0
    loss_timeout: 2.5
    queue_size: 10
    valid_marker_ids: [0, 1, 42]
    pointcloud_rate_map: '{"0": 10.0, "1": 10.0, "2": 7.0, "3": 5.0, "4": 3.0}'
    pointcloud_update_interval: 3.0

    # ── Kalman filter (1-D yaw) ──
    # Process noise: yaw uncertainty growth per second (rad^2/s).
    kf_process_noise: 0.01
    # Process noise used while coasting (no markers) so the published
    # covariance grows faster and the EKF can de-weight the estimate.
    kf_loss_process_noise: 0.05
    # Measurement noise model: sigma_deg = base + dist_coeff * distance / sqrt(count)
    kf_meas_base_sigma_deg: 1.0
    kf_meas_dist_coeff: 2.0
    kf_default_distance: 2.0        # m, used when detection_status has no distance
    # Innovation gate (std-devs); larger allows bigger accepted jumps.
    kf_gate_sigma: 3.0
    # Covariance bounds (deg): reset filter if exceeded, floor applied to output.
    kf_max_cov_deg: 20.0
    kf_min_cov_deg: 0.5
